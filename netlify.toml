# Netlify build & hosting configuration for Daily AI Brief

[build]
  command = "npm run build"
  publish = "dist"
  # Daily brief content lives in data/briefs/ and is served straight from the
  # GitHub Contents API (src/lib/briefs.ts), not from this deployed site — so
  # a commit that only touches it needs no rebuild. Skip (exit 0) when the
  # diff outside data/briefs/ is empty; a real app change (exit 1) still
  # deploys as usual. Keeps the daily automation off Netlify's deploy credits.
  # Guard: when CACHED_COMMIT_REF is missing or equals COMMIT_REF (a known
  # Netlify quirk on some builds), fail open — exit 1 — so real code changes
  # are never skipped by accident. A broken git diff (exit 128) also builds.
  # docs/ and README are excluded too: they never affect the built site, so
  # recipe tuning stays deploy-free just like daily brief content.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!data/briefs' ':!docs' ':!README.md'"

[build.environment]
  NODE_VERSION = "22"

# Serverless functions: the push-notification subscribe endpoint and the
# scheduled morning sender (see netlify/functions/).
[functions]
  directory = "netlify/functions"

# SPA fallback — any unknown path renders the app shell.
# (Real files such as /sw.js and /assets/* are served directly. Brief content
# is fetched from the GitHub Contents API, not from this site — see
# src/lib/briefs.ts.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached aggressively.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
