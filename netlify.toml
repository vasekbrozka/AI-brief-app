# Netlify build & hosting configuration for Daily AI Brief

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — any unknown path renders the app shell.
# (Real files such as /data/*.json, /sw.js and /assets/* are served directly.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brief data should always be revalidated so new days show up quickly.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must never be cached aggressively.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
